<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tum Tum Downloader</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">⚡</span>
        <h1 class="text-xl font-black tracking-wide text-amber-400">Tum Tum Downloader</h1>
      </div>
      <span class="text-xs bg-slate-800 text-slate-400 px-2.5 py-1 rounded-full border border-slate-700">v1.0</span>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-white mb-2">Fast Video & Shorts Downloader</h2>
        <p class="text-sm text-slate-400">Paste your video link below to fetch download formats.</p>
      </div>

      <div class="space-y-3">
        <input 
          type="text" 
          id="videoUrl" 
          placeholder="Paste YouTube or Shorts URL here..." 
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition"
        />
        <button 
          id="fetchBtn" 
          onclick="handleFetch()" 
          class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-xl transition duration-150 active:scale-[0.99] text-sm flex items-center justify-center space-x-2"
        >
          <span>Fetch Media</span>
        </button>
      </div>

      <div id="statusAlert" class="mt-4 hidden p-3 rounded-lg text-xs font-medium text-center"></div>

      <div id="resultCard" class="mt-6 hidden border-t border-slate-800 pt-6">
        <img id="thumbImg" src="" alt="Thumbnail" class="w-full aspect-video rounded-xl object-cover border border-slate-800 mb-3" />
        <h3 id="videoTitle" class="text-sm font-semibold text-slate-200 line-clamp-2 mb-4"></h3>

        <div class="space-y-2">
          <label class="text-xs uppercase tracking-wider text-slate-400 font-bold">Select Quality</label>
          <div id="formatButtons" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    <p>© 2026 Tum Tum Downloader. Built for educational and personal use.</p>
  </footer>

  <script>
    async function handleFetch() {
      const urlInput = document.getElementById('videoUrl');
      const fetchBtn = document.getElementById('fetchBtn');
      const statusAlert = document.getElementById('statusAlert');
      const resultCard = document.getElementById('resultCard');
      const formatButtons = document.getElementById('formatButtons');

      const url = urlInput.value.trim();
      if (!url) {
        showAlert('Please paste a valid video URL first.', 'error');
        return;
      }

      fetchBtn.disabled = true;
      fetchBtn.innerHTML = `<span>Fetching...</span>`;
      resultCard.classList.add('hidden');
      showAlert('Connecting to server...', 'info');

      try {
        const response = await fetch('/api/get-info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (response.ok) {
          statusAlert.classList.add('hidden');
          resultCard.classList.remove('hidden');

          document.getElementById('thumbImg').src = data.thumbnail;
          document.getElementById('videoTitle').innerText = data.title;

          formatButtons.innerHTML = '';
          if (!data.formats || data.formats.length === 0) {
            formatButtons.innerHTML = `<span class="text-xs text-slate-400">Standard direct stream only.</span>`;
          } else {
            data.formats.forEach(f => {
              const btn = document.createElement('a');
              btn.href = `/api/download?url=${encodeURIComponent(url)}&format_id=${f.format_id}`;
              btn.target = "_blank";
              btn.rel = "noopener noreferrer";
              btn.className = "flex items-center justify-center p-2.5 bg-slate-800 hover:bg-amber-500 hover:text-slate-950 font-semibold rounded-lg text-xs transition border border-slate-700";
              btn.innerText = `Download ${f.resolution} (${f.ext})`;
              formatButtons.appendChild(btn);
            });
          }
        } else {
          showAlert(data.error || 'Unable to fetch video.', 'error');
        }
      } catch (err) {
        showAlert('Error contacting backend server.', 'error');
      } finally {
        fetchBtn.disabled = false;
        fetchBtn.innerHTML = `<span>Fetch Media</span>`;
      }
    }

    function showAlert(msg, type) {
      const alert = document.getElementById('statusAlert');
      alert.classList.remove('hidden');
      if (type === 'error') {
        alert.className = "mt-4 p-3 rounded-lg text-xs font-medium text-center bg-red-950/60 border border-red-800 text-red-300";
      } else {
        alert.className = "mt-4 p-3 rounded-lg text-xs font-medium text-center bg-slate-800 border border-slate-700 text-slate-300";
      }
      alert.innerText = msg;
    }
  </script>
</body>
</html>
