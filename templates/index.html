<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tum Tum Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <header class="border-b border-slate-800 bg-slate-900">
        <div class="max-w-xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">⚡</span>
                <span class="text-xl font-black tracking-tighter">Tum Tum Downloader</span>
            </div>
            <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded">v2.0 PRO</span>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl shadow-2xl border border-slate-800">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-black text-white mb-2">Fast Shorts & Video Saver</h2>
                <p class="text-xs text-slate-400">Paste any YouTube Short or Video link to download instantly.</p>
            </div>

            <div class="space-y-4">
                <input type="text" id="videoUrl"
                    placeholder="Paste Shorts or Video link here..."
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 placeholder:text-slate-600 focus:outline-none focus:border-amber-500 transition-all">
                
                <button id="fetchBtn" onclick="processVideo()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition-all flex justify-center items-center">
                    <span>Get Download Options</span>
                </button>
            </div>

            <div id="statusAlert" class="mt-4 hidden p-4 rounded-xl border"></div>

            <div id="resultCard" class="mt-6 hidden border border-slate-800 rounded-2xl overflow-hidden bg-slate-950">
                <div class="relative rounded-2xl overflow-hidden">
                    <img id="thumbImg" src="" alt="Thumbnail" class="w-full h-48 object-cover">
                    <div class="absolute bottom-2 left-2 bg-slate-900/80 backdrop-blur-md text-xs font-bold px-3 py-1 rounded-lg border border-slate-700">Ready</div>
                </div>

                <div class="p-5">
                    <h3 id="videoTitle" class="font-bold text-lg mb-4 line-clamp-2"></h3>
                    
                    <div id="downloadServers" class="space-y-3">
                        <a id="server1Btn" href="" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 flex items-center justify-between transition-all group">
                            <div class="flex items-center space-x-3">
                                <span class="text-amber-500 group-hover:scale-110 transition-transform">💾</span>
                                <span class="font-bold">Download Server 1</span>
                            </div>
                            <span class="text-xs font-bold bg-amber-500/10 text-amber-500 px-2 py-1 rounded-lg">Fastest</span>
                        </a>

                        <a id="server2Btn" href="" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 flex items-center justify-between transition-all group">
                            <div class="flex items-center space-x-3">
                                <span class="text-slate-500 group-hover:scale-110 transition-transform">🛠️</span>
                                <span class="font-bold">Download Server 2 <span class="text-slate-500 font-normal text-xs">(Alternative)</span></span>
                            </div>
                            <span class="text-xs font-bold bg-slate-700 text-slate-300 px-2 py-1 rounded-lg">Backup</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-slate-900 py-6 text-center text-slate-600 text-xs">
        <p>&copy; 2026 Tum Tum Downloader. Free & Fast.</p>
    </footer>

    <script>
        function extractVideoId(url) {
    const regExp = /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\/shorts\/)([^#&?]{11}).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
        }

        async function processVideo() {
            const urlInput = document.getElementById('videoUrl');
            const fetchBtn = document.getElementById('fetchBtn');
            const statusAlert = document.getElementById('statusAlert');
            const resultCard = document.getElementById('resultCard');

            const rawUrl = urlInput.value.trim();
            const videoId = extractVideoId(rawUrl);

            if (!videoId) {
                showAlert('Please paste a valid YouTube Short or Video URL', 'error');
                return;
            }

            fetchBtn.disabled = true;
            fetchBtn.innerHTML = '<span>Processing Link...</span>';
            resultCard.classList.add('hidden');
            statusAlert.classList.add('hidden');

            try {
                const response = await fetch('/api/get-info', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: rawUrl })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to extract video');
                }

                // Update UI Elements
                document.getElementById('videoTitle').innerText = data.title;
                const thumbUrl = `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`;
                document.getElementById('thumbImg').src = thumbUrl;

                // Find highest resolution format (mp4)
                let bestFormat = data.formats.find(f => f.format_id === '18') || data.formats[0]; 
                
                // Set direct download links if available, fallback to standard stream
                const directUrl = bestFormat.url || rawUrl;
                document.getElementById('server1Btn').href = directUrl;

                resultCard.classList.remove('hidden');

            } catch (err) {
                showAlert(err.message, 'error');
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.innerHTML = '<span>Get Download Options</span>';
            }
        }

        function showAlert(msg, type) {
            const alert = document.getElementById('statusAlert');
            alert.innerText = msg;
            alert.className = `mt-4 p-4 rounded-xl border ${type === 'error' ? 'bg-red-500/10 border-red-500/50 text-red-500' : 'bg-green-500/10 border-green-500/50 text-green-500'}`;
            alert.classList.remove('hidden');
        }
    </script>
</body>
</html>
